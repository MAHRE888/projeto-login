<!DOCTYPE html>
<html lang="PT-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="estilos/style.css">
  <link rel="stylesheet" href="estilos/media-query.css">

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>

<body>
  <main>
    <section id="login">
      <div id="imagem">

      </div>
      <div id="formulario">
        <h1>Login</h1>
        <br>
        <p>Olá seja bem vindo (a), faça login para acessar sua conta.</p>
        <form action="login.php" method="post" autocomplete="on">

          <div class="campo">

            <span class="material-symbols-outlined">
              account_circle
            </span>

            <input type="email" name="email" id="iemail" placeholder="Seu email" autocomplete="email" required>
            <label for="iemail">Email</label>
          </div>

          <div class="campo">
            <span class="material-symbols-outlined">
              vpn_key
            </span>
            <input type="password" name="senha" id="isenha" placeholder="sua senha" autocomplete="current-password" required maxlength="4">
            <label for="isenha">Senha</label>
          </div>
          <div>
            <input type="submit" value="Entrar">
            <a href="esqueci.html">Esqueci a senha</a>
            <span class="material-symbols-outlined">
              forward_to_inbox
            </span>

          </div>

        </form>
      </div>
    </section>
  </main>
</body>

</html>
